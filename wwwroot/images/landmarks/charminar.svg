<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="charminarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="charminarStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Base Plinth -->
  <rect x="12" y="50" width="40" height="5" rx="1.5" fill="#78350f"/>
  <rect x="15" y="47" width="34" height="3" fill="#92400e"/>
  
  <!-- Central Main Block -->
  <rect x="19" y="27" width="26" height="20" fill="url(#charminarStone)"/>
  
  <!-- Grand Center Archway -->
  <path d="M 26 47 L 26 36 Q 32 30 38 36 L 38 47 Z" fill="#451a03"/>
  <path d="M 28 47 L 28 38 Q 32 33 36 38 L 36 47 Z" fill="#292524"/>
  
  <!-- Upper Gallery / Jharokhas -->
  <rect x="17" y="23" width="30" height="4" rx="1" fill="#f59e0b"/>
  <!-- Balcony arches -->
  <circle cx="23" cy="25" r="1.2" fill="#78350f"/>
  <circle cx="27.5" cy="25" r="1.2" fill="#78350f"/>
  <circle cx="32" cy="25" r="1.2" fill="#78350f"/>
  <circle cx="36.5" cy="25" r="1.2" fill="#78350f"/>
  <circle cx="41" cy="25" r="1.2" fill="#78350f"/>
  
  <!-- Upper Central Domes -->
  <path d="M 27 23 Q 32 17 37 23 Z" fill="#d97706"/>
  <circle cx="32" cy="16.5" r="1" fill="#f59e0b"/>
  
  <!-- 4 Iconic Minarets (Front 2 and Back 2) -->
  <!-- Left Outer Minaret -->
  <rect x="14" y="16" width="5" height="32" rx="0.8" fill="#b45309"/>
  <rect x="13" y="28" width="7" height="2" fill="#f59e0b"/>
  <rect x="13.5" y="20" width="6" height="2" fill="#f59e0b"/>
  <!-- Left Dome & Finial -->
  <path d="M 13.5 16 Q 16.5 10 19.5 16 Z" fill="#d97706"/>
  <line x1="16.5" y1="10" x2="16.5" y2="7.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16.5" cy="7" r="1" fill="#fbbf24"/>
  
  <!-- Right Outer Minaret -->
  <rect x="45" y="16" width="5" height="32" rx="0.8" fill="#b45309"/>
  <rect x="44" y="28" width="7" height="2" fill="#f59e0b"/>
  <rect x="44.5" y="20" width="6" height="2" fill="#f59e0b"/>
  <!-- Right Dome & Finial -->
  <path d="M 44.5 16 Q 47.5 10 50.5 16 Z" fill="#d97706"/>
  <line x1="47.5" y1="10" x2="47.5" y2="7.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="47.5" cy="7" r="1" fill="#fbbf24"/>

  <!-- Left Inner Minaret Top -->
  <rect x="22" y="19" width="3.5" height="5" fill="#78350f"/>
  <path d="M 21.5 19 Q 23.75 14 26 19 Z" fill="#b45309"/>
  <line x1="23.75" y1="14" x2="23.75" y2="12" stroke="#f59e0b" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Right Inner Minaret Top -->
  <rect x="38.5" y="19" width="3.5" height="5" fill="#78350f"/>
  <path d="M 38 19 Q 40.25 14 42.5 19 Z" fill="#b45309"/>
  <line x1="40.25" y1="14" x2="40.25" y2="12" stroke="#f59e0b" stroke-width="1" stroke-linecap="round"/>
</svg>
