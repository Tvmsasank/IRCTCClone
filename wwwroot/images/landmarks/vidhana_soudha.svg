<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vsDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="vsStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  
  <!-- Base Stairs / Foundation -->
  <rect x="10" y="52" width="44" height="3" rx="1" fill="#475569"/>
  <rect x="13" y="49" width="38" height="3" fill="#64748b"/>
  <rect x="16" y="46" width="32" height="3" fill="#94a3b8"/>
  
  <!-- Main Building Block -->
  <rect x="14" y="32" width="36" height="15" rx="0.5" fill="url(#vsStone)"/>
  
  <!-- Colonnade / Pillars -->
  <rect x="17" y="34" width="2" height="12" fill="#475569"/>
  <rect x="21" y="34" width="2" height="12" fill="#475569"/>
  <rect x="25" y="34" width="2" height="12" fill="#475569"/>
  <rect x="37" y="34" width="2" height="12" fill="#475569"/>
  <rect x="41" y="34" width="2" height="12" fill="#475569"/>
  <rect x="45" y="34" width="2" height="12" fill="#475569"/>
  
  <!-- Grand Central Entrance Arch -->
  <path d="M 29 46 L 29 38 Q 32 34 35 38 L 35 46 Z" fill="#1e293b"/>
  
  <!-- Pediment / Entablature -->
  <polygon points="12,32 32,23 52,32" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
  <polygon points="26,32 32,26 38,32" fill="#ca8a04"/>
  
  <!-- Central Great Dome Drum -->
  <rect x="26" y="19" width="12" height="5" rx="0.5" fill="#e2e8f0"/>
  <rect x="28" y="20.5" width="1.5" height="3.5" fill="#475569"/>
  <rect x="31.25" y="20.5" width="1.5" height="3.5" fill="#475569"/>
  <rect x="34.5" y="20.5" width="1.5" height="3.5" fill="#475569"/>
  
  <!-- Central Dome -->
  <path d="M 25 19 Q 32 9 39 19 Z" fill="url(#vsDome)"/>
  
  <!-- Four-Lion Crest / Ashoka Spire on Top -->
  <line x1="32" y1="9" x2="32" y2="5.5" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="1.2" fill="#facc15"/>
  
  <!-- Left Side Wing Dome -->
  <rect x="14" y="27" width="6" height="4" fill="#cbd5e1"/>
  <path d="M 13.5 27 Q 17 21 20.5 27 Z" fill="#ca8a04"/>
  <line x1="17" y1="21" x2="17" y2="18.5" stroke="#ca8a04" stroke-width="0.8"/>
  
  <!-- Right Side Wing Dome -->
  <rect x="44" y="27" width="6" height="4" fill="#cbd5e1"/>
  <path d="M 43.5 27 Q 47 21 50.5 27 Z" fill="#ca8a04"/>
  <line x1="47" y1="21" x2="47" y2="18.5" stroke="#ca8a04" stroke-width="0.8"/>
</svg>
